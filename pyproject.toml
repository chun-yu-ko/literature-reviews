[project]
name = "literature-reviews"
version = "0.1.0"
description = "文獻回顧自動化工具 — 支援 arXiv / PubMed 多來源搜尋"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
litreview = "litreview.cli:main"

dependencies = [
    "anthropic>=0.89.0",
    "beautifulsoup4>=4.14.3",
    "click>=8.3.2",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pymupdf>=1.27.2.2",
    "rich>=14.3.3",
    "tqdm>=4.67.3",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
